version: 2

models:
  - name: customer_transaction_summary
    description: Customer transaction summary mart.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: Customer name.
        data_tests:
          - not_null
      - name: total_amount
        description: Total transaction amount for the customer.
        data_tests:
          - not_null
